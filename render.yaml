services:
  # Express API: brewery data, live search, nearby places, routing.
  - type: web
    name: brewery-api
    runtime: node
    rootDir: api
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: brewery_compass
      - key: CLIENT_URL
        sync: false

  # Static front-end (Vite + React).
  - type: web
    name: brewery-compass
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Update this if your API service ends up with a different name/URL.
      - key: VITE_API_URL
        value: https://brewery-api-tyq3.onrender.com/api
