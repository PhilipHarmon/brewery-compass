services:
  # Express API: brewery data, live search, nearby places, routing.
  - type: web
    name: brewery-api
    runtime: node
    rootDir: api
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: brewery_compass
      - key: CLIENT_URL
        sync: false
      # v9 additions — set these in the dashboard (see the v9 build sheet).
      # TICKETMASTER_API_KEY / SEATGEEK_CLIENT_ID power Happening Nearby;
      # ADMIN_KEY unlocks the /admin area. All three are optional to deploy:
      # without them those features stay quietly off.
      - key: TICKETMASTER_API_KEY
        sync: false
      - key: SEATGEEK_CLIENT_ID
        sync: false
      - key: ADMIN_KEY
        sync: false
      # v11 — Eventbrite private token (optional): lights up the curated
      # Triangle organizer pulls in Happening Nearby. The iCal half of the
      # local layer needs no key. Set in the dashboard only.
      - key: EVENTBRITE_TOKEN
        sync: false

  # Static front-end (Vite + React).
  - type: web
    name: brewery-compass
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Update this if your API service ends up with a different name/URL.
      - key: VITE_API_URL
        value: https://brewery-api-tyq3.onrender.com/api
